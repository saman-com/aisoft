name: PR-Agent

on:
  pull_request:
    types: [opened, synchronize, reopened]

# PR-Agent reads the diff through the GitHub API and posts a review comment,
# so it needs read access to the repo and write access to the PR.
permissions:
  contents: read
  pull-requests: write
  issues: write

# One review at a time per PR. A new push cancels the review of the previous
# head, which is what we want: the parser polls for the latest review.
concurrency:
  group: pr-agent-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-agent:
    name: PR-Agent review
    runs-on: ubuntu-latest
    # Never review PRs opened by PR-Agent's own bot account, and never try to
    # review from forks where the OpenRouter secret is unavailable.
    if: >-
      github.event.sender.type != 'Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Run PR-Agent
        uses: the-pr-agent/pr-agent@v0.48.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PR-Agent reads OpenRouter credentials from OPENROUTER__KEY
          # (the [openrouter] key in its secrets template). GitHub stores the
          # value as OPENROUTER_API_KEY - see README.md.
          OPENROUTER__KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Model and review flags come from .pr_agent.toml at the repo root.
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"
